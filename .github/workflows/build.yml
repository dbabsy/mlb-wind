name: Build and deploy

on:
  schedule:
    # Lineups post two to four hours before first pitch, so this needs to run
    # through the afternoon and evening.
    #
    # Twice an hour, and deliberately NOT on the hour. GitHub treats schedules
    # as best-effort and ":00" is the most contended minute on the platform;
    # runs there are routinely delayed by an hour or dropped entirely. Odd
    # minutes are far less contested, and the second slot covers the first if
    # it gets skipped.
    # 13:00-03:00 UTC is roughly 8am-10pm Central: early enough that a morning
    # visit already shows today's card rather than last night's, late enough to
    # cover the end of a west-coast game.
    - cron: "17,47 13-23,0-3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The Statcast pull is the slow part and only the current season can
      # change, so prior years are restored from cache and skipped.
      - name: Restore Statcast cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: statcast-${{ github.run_id }}
          restore-keys: statcast-

      - name: Fetch data
        run: python3 fetch.py

      - name: Refresh current season
        run: python3 fetch.py --years 2026 --force

      - name: Fit park orientations
        run: python3 orient.py

      - name: Build pages
        run: |
          mkdir -p public
          python3 wind.py --out public/index.html
          python3 daily.py --out public/daily.html
          python3 players.py --out public/players.html
          python3 games.py --out public/games.html
          python3 hits.py --out public/hits.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
