name: Build and deploy

on:
  schedule:
    # Hourly through the window that matters: lineups post two to four hours
    # before first pitch, so a once-a-day build would always show a projected
    # card. 15:00-02:00 UTC is roughly 11am-10pm Eastern.
    - cron: "0 15-23,0-2 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The Statcast pull is the slow part and only the current season can
      # change, so prior years are restored from cache and skipped.
      - name: Restore Statcast cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: statcast-${{ github.run_id }}
          restore-keys: statcast-

      - name: Fetch data
        run: python3 fetch.py

      - name: Refresh current season
        run: python3 fetch.py --years 2026 --force

      - name: Fit park orientations
        run: python3 orient.py

      - name: Build pages
        run: |
          mkdir -p public
          python3 wind.py --out public/index.html
          python3 daily.py --out public/daily.html
          python3 players.py --out public/players.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
