name: Build and deploy

on:
  schedule:
    # GitHub treats schedules as best-effort, and on this repo it has been
    # delivering a small fraction of them — 28 requested runs a day was
    # yielding about four, then none at all for twenty hours. Asking for less,
    # at uncontended minutes, gives each request a better chance than
    # spraying requests that get dropped.
    #
    # Times are chosen for what each pass is for (UTC; CT is UTC-5):
    #   12:23  7:23am  roll to today's slate, score last night
    #   16:23 11:23am  midday refresh
    #   19:23  2:23pm  first lineups appearing
    #   21:23  4:23pm  most lineups posted
    #   22:53  5:53pm  last call before the evening games
    #   03:23 10:23pm  score the early finals
    - cron: "23 12,16,19,21 * * *"
    - cron: "53 22 * * *"
    - cron: "23 3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write        # the ledger is committed back to the repo
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The Statcast pull is the slow part and only the current season can
      # change, so prior years are restored from cache and skipped.
      - name: Restore Statcast cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: statcast-${{ github.run_id }}
          restore-keys: statcast-

      # The ledger's honesty rules are the one thing in this repo that a bug
      # can quietly turn into a false claim on a public page, so they are
      # checked before anything is built. No network needed.
      - name: Test ledger rules
        run: python3 test_ledger.py

      - name: Fetch data
        run: python3 fetch.py

      - name: Refresh current season
        run: python3 fetch.py --years 2026 --force

      - name: Fit park orientations
        run: python3 orient.py

      - name: Build pages
        run: |
          mkdir -p public
          python3 wind.py --out public/index.html
          python3 daily.py --out public/daily.html
          python3 players.py --out public/players.html
          python3 games.py --out public/games.html
          python3 hits.py --out public/hits.html

      # Freeze today's pre-game predictions, settle any that have finished,
      # then publish the running record.
      - name: Update accuracy ledger
        run: |
          python3 ledger.py --all \
            --hits-html public/hits.html \
            --games-html public/games.html \
            --out public/accuracy.html

      # The build takes a couple of minutes, so another push can land on main
      # while it runs and reject this one. That used to fail the whole job and
      # skip the deploy — and worse, lose the frozen predictions, which cannot
      # be re-recorded once those games have started. So: take the newer main,
      # re-derive the ledger on top of it (record and score are idempotent),
      # and try again.
      - name: Commit ledger
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            if [ -z "$(git status --porcelain ledger/)" ]; then
              echo "ledger unchanged"
              exit 0
            fi
            git add ledger/
            # [skip ci] keeps this commit from triggering another build.
            git commit -m "Update accuracy ledger [skip ci]" || true
            if git push; then
              echo "ledger pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected on attempt $attempt; rebuilding the ledger on top of the newer main"
            git fetch origin main
            git reset --hard origin/main
            python3 ledger.py --all \
              --hits-html public/hits.html \
              --games-html public/games.html \
              --out public/accuracy.html
          done
          # Never fail the build for this — the pages should still deploy.
          echo "::warning::ledger could not be pushed after 3 attempts"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
